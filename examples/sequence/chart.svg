  --teal-fill: #b9f5ee; --teal-stroke: #008674;
  --blue-fill: #d0e5ff; --blue-stroke: #0772e6;
  --orange-fill: #ffdea7; --orange-stroke: #ec5a00;
  --green-fill: #c4f7c9; --green-stroke: #008b06;
