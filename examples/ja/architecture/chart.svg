.arrow-filled { fill: var(--connector, var(--line)); stroke: none; }
.arrow-open, .lost { fill: none; stroke: var(--connector, var(--line)); stroke-width: 1.5px; }
.primary { --connector: var(--accent); }
.trust-break { --connector: var(--break-stroke); }
