  --zone-fill: #f6f7f9; --zone-header: #e8ebef; --zone-stroke: #9aa1ab;
  --break-fill: #ffe3e5; --break-stroke: #d6141f; --break-text: #b0101a;
  --note-fill: #fff4c2; --note-stroke: #c9a400;
  font-family: var(--font-family);
