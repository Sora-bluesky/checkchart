name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: skills/checkchart/scripts
      - run: node --disable-warning=ExperimentalWarning --test test/*.test.ts
        working-directory: skills/checkchart/scripts
